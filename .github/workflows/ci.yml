# CI ЗАВОД-7 (раздел 19): типы, юнит-тесты и детерминизм, хаос-тест, бенчмарки (предупреждение при >10% хуже),
# сборка, E2E в Chromium. Полный прогон Firefox/WebKit — задание e2e-all (вручную или по тегу v*).
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Типы
        run: npx tsc -p .
      - name: Юнит-тесты (конвейеры, манипуляторы, сети, жидкости, рецепты, исследования, детерминизм, совместимость сохранений)
        run: npm test
      - name: Хаос-тест (случайные действия на поздней партии)
        run: npx tsx tests/chaos.test.ts
      - name: railnet 10h
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: npx tsx tests/railnet.test.ts
      - name: Баланс (цели 13.3, 1.3, 9.3)
        run: npx tsx tools/balance.ts --check
      # время тика хранится между прогонами в кэше; первый прогон на ветке сравнивает с tests/bench-baseline.json
      - name: База бенчмарков из прошлого прогона
        uses: actions/cache/restore@v4
        with:
          path: bench-ci.json
          key: bench-${{ runner.os }}-${{ github.ref_name }}-
          restore-keys: bench-${{ runner.os }}-
      - name: Бенчмарки (1000 печей, 10 000 конвейеров, 200 сборщиков с маяками)
        run: |
          if [ -f bench-ci.json ]; then export BENCH_BASELINE=$PWD/bench-ci.json; fi
          npx tsx tests/bench.ts --check
          BENCH_BASELINE=$PWD/bench-ci.json npx tsx tests/bench.ts --update > /dev/null
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: bench-ci.json
          key: bench-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
      - name: Сборка
        run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: zavod7-dist, path: dist }
      # E2E-тесты рассчитаны на пути песочницы разработки: /usr/local/bin/chromium и /data/game
      - name: Браузер для E2E
        run: |
          npx playwright install --with-deps chromium
          sudo ln -sf "$(node -e "import('playwright').then(p => console.log(p.chromium.executablePath()))")" /usr/local/bin/chromium
          sudo mkdir -p /data && sudo ln -sfn "$GITHUB_WORKSPACE" /data/game
      - name: E2E (Chromium)
        run: |
          for t in e2e5 e2e6 e2e7 e2e8 e2e9 e2e10 e2e11; do node tests/$t.mjs; done
          npx tsx tests/e2e12.mjs chromium
          node tests/e2e13.mjs chromium
          node tests/e2e14.mjs
          node tests/e2e15.mjs chromium
          node tests/e2e16.mjs chromium
          node tests/e2e17.mjs chromium
          node tests/e2e18.mjs chromium
          node tests/e2e19.mjs chromium
          node tests/e2e20.mjs chromium
          node tests/e2e21.mjs chromium
          node tests/e2e22.mjs chromium
          node tests/e2e23.mjs chromium
  e2e-all:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run build
      - run: |
          npx playwright install --with-deps chromium firefox webkit
          sudo ln -sf "$(node -e "import('playwright').then(p => console.log(p.chromium.executablePath()))")" /usr/local/bin/chromium
          sudo mkdir -p /data && sudo ln -sfn "$GITHUB_WORKSPACE" /data/game
      - name: E2E — Chromium, Firefox, WebKit
        run: |
          for b in chromium firefox webkit; do npx tsx tests/e2e12.mjs $b; node tests/e2e13.mjs $b; node tests/e2e15.mjs $b; node tests/e2e16.mjs $b; node tests/e2e17.mjs $b; node tests/e2e18.mjs $b; node tests/e2e19.mjs $b; node tests/e2e20.mjs $b; node tests/e2e21.mjs $b; node tests/e2e22.mjs $b; node tests/e2e23.mjs $b; done
